[project]
name = "spchat-server"
version = "0.1.0"
description = "SPChat FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
